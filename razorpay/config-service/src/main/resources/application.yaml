spring:
  application:
    name: config-service

  cloud:
    config.server.git:
      uri: https://github.com/SohamBhandary/distributed-razorpay-config
      username: SohamBhandary
      password: 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
      default-label: main

server.port: 8888


management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    config:
      enabled: false
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  metrics:
    tags:
      application: ${spring.application.name}


---

spring:
  config:
    activate:
      on-profile: k8s

  cloud:
    discovery:
      enabled: false

    config.server.git:
      uri: ${GIT_CONFIG_REPO}
      username: ${GIT_USERNAME}
      password: ${GIT_PASSWORD}

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  zipkin:
    tracing:
      endpoint: http://zipkin.razorpay-core.svc.cluster.local:9411/api/v2/spans




